<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador Pro | Banco Guayaquil</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#160441',
                        secondary: '#D2006E',
                        white: '#FFFFFF',
                        'text-main': '#FFFFFF',
                        'text-muted': '#A1A1AA',
                        border: 'rgba(255, 255, 255, 0.1)',
                        error: '#FB7185',
                        success: '#34D399',
                    },
                    borderRadius: {
                        'xl': '20px',
                        'lg': '10px',
                    },
                    backdropBlur: {
                        'xs': '2px',
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body
    class="bg-slate-50 text-slate-900 dark:bg-primary dark:text-text-main font-['Nunito_Sans'] transition-colors duration-300">
    <div class="flex flex-col min-h-screen">
        <header
            class="sticky top-0 z-50 bg-white/80 dark:bg-primary/80 backdrop-blur-md px-8 py-5 border-b border-slate-200 dark:border-border">
            <div class="max-w-[1400px] mx-auto flex justify-between items-center">
                <div class="flex items-center gap-10">
                    <img src="assets/logo.png" alt="Banco Guayaquil"
                        class="h-[38px] w-auto dark:brightness-100 brightness-0 opacity-80 dark:opacity-100">
                </div>
                <div class="flex gap-4 items-center">
                    <!-- Las clases de estado (abierto/cerrado) las reasigna getSidebarToggleClass() -->
                    <button id="sidebar-toggle" aria-expanded="true" title="Mostrar/Ocultar Sugerencias"
                        class="px-6 py-3 rounded-lg bg-slate-200 dark:bg-white/10 border border-slate-300 dark:border-white/20 text-slate-900 dark:text-white font-bold text-sm cursor-pointer transition-all">
                        Ayuda
                    </button>
                    <div class="h-8 w-px bg-slate-200 dark:bg-border mx-1"></div>
                    <button id="theme-toggle"
                        class="p-3 rounded-lg bg-slate-100 dark:bg-white/5 border border-slate-200 dark:border-border text-slate-600 dark:text-text-muted hover:bg-slate-200 dark:hover:bg-white/10 transition-all"
                        title="Cambiar tema">
                        <i data-lucide="moon" id="theme-icon-dark" class="hidden dark:block"></i>
                        <i data-lucide="sun" id="theme-icon-light" class="block dark:hidden"></i>
                    </button>
                    <div class="h-8 w-px bg-slate-200 dark:bg-border mx-1"></div>
                    <button id="btn-reset"
                        class="inline-flex items-center gap-2 px-6 py-3 bg-slate-100 dark:bg-white/5 border border-slate-200 dark:border-border rounded-lg font-bold text-sm cursor-pointer transition-all hover:bg-slate-200 dark:hover:bg-white/10">
                        <i data-lucide="rotate-ccw"></i> Resetear
                    </button>
                </div>
            </div>
        </header>

        <main class="flex-1 px-8 py-12 max-w-[1400px] mx-auto w-full">

            <div id="tabs-container" class="flex gap-2 mb-6 flex-wrap"></div>

            <div id="layout-wrapper" class="grid grid-cols-1 lg:grid-cols-[1fr_320px] gap-8 items-start transition-all duration-300">
                <section
                    class="bg-white dark:bg-white/5 backdrop-blur-xl border border-slate-200 dark:border-white/10 rounded-xl shadow-xl dark:shadow-2xl p-7 flex flex-col gap-8">
                    <div class="mb-2">
                        <h1 id="generator-title" class="text-[1.5rem] font-extrabold text-slate-900 dark:text-white mb-2 tracking-tight"></h1>
                        <p id="generator-description" class="text-slate-500 dark:text-text-muted text-base"></p>
                    </div>

                    <div id="generator-fields" class="hidden grid grid-cols-1 md:grid-cols-2 gap-4"></div>

                    <div class="overflow-x-auto border border-slate-200 dark:border-border rounded-lg bg-white dark:bg-black/20"
                        id="grid-container">
                        <table class="w-full border-collapse" id="main-grid">
                            <thead>
                                <tr id="grid-header"
                                    class="bg-slate-50 dark:bg-white/[0.03] border-b border-slate-200 dark:border-border">
                                </tr>
                            </thead>
                            <tbody id="grid-body">
                            </tbody>
                        </table>
                    </div>

                    <div class="flex justify-between items-center pt-4 border-t border-slate-200 dark:border-border">
                        <div class="flex gap-6 text-slate-500 dark:text-text-muted text-[0.85rem]">
                            <span id="row-count"></span>
                            <span id="status-message" class="font-semibold text-success"></span>
                        </div>
                        <div id="footer-actions" class="flex items-center gap-3">
                            <button id="btn-add-row"
                                class="inline-flex items-center gap-2 px-6 py-3 bg-transparent text-slate-500 dark:text-text-muted rounded-lg font-bold text-sm cursor-pointer transition-all hover:bg-slate-100 dark:hover:bg-white/5 hover:text-slate-900 dark:hover:text-white">
                                <i data-lucide="plus"></i> Añadir Fila
                            </button>
                            <div class="h-6 w-px bg-slate-200 dark:bg-border"></div>
                            <div
                                class="flex items-center gap-2 px-4 py-2 bg-slate-100 dark:bg-white/5 border border-slate-200 dark:border-border rounded-lg text-slate-500 dark:text-text-muted h-[46px]">
                                <i data-lucide="file-text" class="w-4 h-4"></i>
                                <input type="text" id="input-filename" placeholder="Nombre..." value="carga_masiva"
                                    class="bg-transparent border-none text-slate-900 dark:text-white text-sm font-inherit outline-none w-[200px]">
                                <span class="text-xs">.txt</span>
                            </div>
                            <button id="btn-download"
                                class="inline-flex items-center gap-2 px-6 py-3 bg-gradient-to-br from-secondary to-[#ec4899] rounded-lg font-bold text-sm cursor-pointer transition-all hover:-translate-y-0.5 hover:shadow-[0_10px_20px_-5px_rgba(210,0,110,0.5)] hover:brightness-110 disabled:opacity-40 disabled:cursor-not-allowed disabled:grayscale-[0.5] text-white"
                                disabled>
                                <i data-lucide="download"></i> Descargar TXT
                            </button>
                        </div>
                    </div>
                </section>

                <aside id="sidebar-panel" class="flex flex-col gap-6 transition-all duration-300 overflow-hidden">
                    <div
                        class="bg-white dark:bg-white/5 backdrop-blur-xl border border-slate-200 dark:border-white/10 rounded-xl p-7 shadow-lg dark:shadow-none w-[320px]">
                        <h3 class="text-[1.1rem] font-bold text-slate-900 dark:text-white mb-5 flex items-center gap-3">
                            <i data-lucide="info" class="text-secondary"></i> Recomendaciones
                        </h3>
                        <div id="sidebar-content" class="flex flex-col gap-5"></div>
                        <div id="sidebar-tip" class="mt-6 pt-6 border-t border-slate-200 dark:border-border flex gap-3 hidden">
                            <i data-lucide="zap" class="w-5 h-5 text-amber-500 dark:text-amber-400 shrink-0"></i>
                            <p id="sidebar-tip-text" class="text-[0.85rem] text-slate-500 dark:text-text-muted italic"></p>
                        </div>
                        <!-- Aviso importante: va al final y con más peso visual que el tip -->
                        <div id="sidebar-notice"
                            class="mt-6 flex gap-3 rounded-lg border border-secondary/40 bg-secondary/5 dark:bg-secondary/10 p-4 hidden">
                            <i data-lucide="alert-circle" class="w-5 h-5 text-secondary shrink-0"></i>
                            <p id="sidebar-notice-text"
                                class="text-[0.85rem] font-semibold text-slate-700 dark:text-white leading-relaxed"></p>
                        </div>
                    </div>
                </aside>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>

</html>
